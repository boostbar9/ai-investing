[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investing"
version = "0.1.0"
description = "Local AI Investing Platform — v3.1"
requires-python = ">=3.12"
authors = [{ name = "Devin", email = "devfarinsky@gmail.com" }]
license = "MIT"
readme = "README.md"

dependencies = [
  # Web / API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
  # Data
  "pandas>=2.2",
  "numpy>=2.1",
  "polars>=1.10",
  "pyarrow>=17.0",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.1",
  # Quant
  "vectorbt>=0.26",
  "nautilus-trader>=1.200; python_version < '3.13'",
  # ML / LLM
  "scikit-learn>=1.5",
  "hmmlearn>=0.3",
  "ollama>=0.3",
  "langgraph>=0.2",
  "temporalio>=1.7",
  # Observability
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "structlog>=24.4",
  # Broker / data sources
  "alpaca-py>=0.33",
  "yfinance>=0.2.40",  # fallback price provider (regime + dip_watch)
  "websockets>=13.0",  # Phase 25.4: Finnhub live tick stream client
  # Auth
  "pyjwt>=2.9",
  # Secrets storage (Windows Credential Manager + cross-platform fallback)
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-redis",
  "types-requests",
]
# System-tray launcher (tools/tray/cockpit_tray.py).
# Only installed on the operator's desktop -- not needed for CI, headless
# servers, or the test suite. Install with:  pip install -e ".[tray]"
tray = [
  "pystray>=0.19",
  "Pillow>=10.0",
]

# ----- setuptools: pick the Python source dirs explicitly -----
# Without this, auto-discovery finds 'apps', 'data', 'infra', 'baselines',
# 'packages' as top-level packages and refuses to build (PEP 621 multi-pkg
# flat-layout error). Restrict to the actual Python source tree.
[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "tools*"]
exclude = ["apps*", "data*", "docs*", "infra*", "baselines*", "scripts*", "node_modules*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"packages.cockpit.web" = ["templates/*.html"]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/telegram-bot",
  "packages/agents",
  "packages/strategies",
  "packages/regime",
  "packages/risk",
  "packages/execution",
  "packages/data",
  "packages/features",
  "packages/backtests",
  "packages/shared",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF002: the × multiplication sign is intentional v3.1 spec notation in risk docs.
ignore = ["E501", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps", "tools"]
pythonpath = ["."]

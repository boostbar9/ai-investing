name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck cockpit
        run: pnpm --filter cockpit typecheck
      - name: Build cockpit
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter cockpit build

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install numpy pandas pydantic pydantic-settings httpx pytest pytest-asyncio pyjwt fastapi \
            opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp \
            ruff alembic sqlalchemy temporalio
      - name: Lint
        run: ruff check packages apps
      - name: Tests
        run: pytest packages apps -q

name: Nightly Backtests

on:
  schedule:
    # 09:00 UTC = 02:00 PT — runs after US market close + data refresh
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  matrix:
    name: ${{ matrix.strategy }} × ${{ matrix.regime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [trend-following, sector-rotation, mean-reversion, sentiment-overlay]
        regime: [bull, bear, chop, crisis, full-history]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install numpy pandas pyarrow pydantic pydantic-settings httpx pytest pytest-asyncio pyjwt fastapi pillow
      - name: Run backtest
        run: |
          mkdir -p artifacts
          python -m packages.backtests.run \
            --strategy ${{ matrix.strategy }} \
            --regime ${{ matrix.regime }} \
            --output artifacts/${{ matrix.strategy }}-${{ matrix.regime }}.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ matrix.strategy }}-${{ matrix.regime }}
          path: artifacts/
          if-no-files-found: ignore

  gate:
    name: Sharpe-drop gate
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # token with write access so post-gate baseline refresh can push
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps
        run: pip install numpy pandas pydantic
      - name: Download current run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Pull last green baseline (best-effort)
        # baselines/ is committed to the repo by the post-gate job below on
        # successful nightly runs against main. First run on a fresh repo
        # has no baselines, which the gate treats as a no-op.
        run: |
          mkdir -p baselines
          if [ -d baselines/main ]; then cp -r baselines/main/* baselines/; fi
      - name: Run Sharpe-drop gate
        run: |
          python -m packages.backtests.nightly_gate \
            --current artifacts/ \
            --baseline baselines/ \
            --max-drop 0.10
      - name: Persist baseline (main only)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          set +e
          shopt -s nullglob globstar
          json_files=(artifacts/**/*.json)
          if [ ${#json_files[@]} -eq 0 ]; then
            echo "nightly_gate: no artifacts to persist; skipping."
            exit 0
          fi
          rm -rf baselines/main && mkdir -p baselines/main
          cp "${json_files[@]}" baselines/main/
          if [ -n "$(git status --porcelain baselines/)" ]; then
            git config user.name  "nightly-gate"
            git config user.email "nightly-gate@users.noreply.github.com"
            git add baselines/
            git commit -m "chore(nightly): refresh Sharpe baselines [skip ci]"
            git push
          fi
        shell: bash

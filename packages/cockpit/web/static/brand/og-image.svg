<?xml version="1.0" encoding="UTF-8"?>
<!-- Open Graph / social preview card. 1200x630 is the canonical size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ogup" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative chart line in background -->
  <path d="M 0 480 L 120 460 L 220 470 L 340 420 L 460 430 L 580 380 L 700 340 L 820 290 L 940 260 L 1060 200 L 1200 160"

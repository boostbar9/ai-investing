<?xml version="1.0" encoding="UTF-8"?>
<!-- The Seer — brand mark. Square, works at 16px through 1024px.
     Motif: a stylized seer's eye whose pupil is a candlestick + spark,
     framed by a hexagonal sigil. Palette: Seer teal #00E5C4 and
     violet #8B5CF6 on midnight #0B0F14. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Seer">
  <defs>
    <linearGradient id="seer-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131A24"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="seer-iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5C4"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="seer-ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5C4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="seer-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00E5C4" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#00E5C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square plate -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#seer-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" ry="13.5" fill="none" stroke="rgba(255,255,255,0.07)"/>

  <!-- soft inner glow -->
  <circle cx="32" cy="32" r="22" fill="url(#seer-glow)" opacity="0.85"/>

  <!-- outer hex sigil -->
  <polygon points="32,8 53,20 53,44 32,56 11,44 11,20"
           fill="none" stroke="url(#seer-ring)" stroke-width="1.4"
           stroke-linejoin="round" opacity="0.7"/>

  <!-- almond eye shape -->
  <path d="M9 32 C18 18, 46 18, 55 32 C46 46, 18 46, 9 32 Z"
        fill="none" stroke="url(#seer-iris)" stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- iris -->
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="url(#seer-iris)" stroke-width="1.6"/>

  <!-- pupil = mini up-candle -->
  <rect x="30.4" y="26.5" width="3.2" height="11" rx="1" fill="#00E5C4"/>
  <line x1="32" y1="24" x2="32" y2="26.5" stroke="#00E5C4" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="32" y1="37.5" x2="32" y2="40" stroke="#00E5C4" stroke-width="1.4" stroke-linecap="round"/>

  <!-- spark (foresight) -->
  <circle cx="32" cy="22" r="1.8" fill="#F8FAFC"/>
  <circle cx="32" cy="22" r="3.2" fill="none" stroke="#00E5C4" stroke-width="0.8" opacity="0.55"/>
</svg>

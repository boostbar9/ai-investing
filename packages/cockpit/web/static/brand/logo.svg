<?xml version="1.0" encoding="UTF-8"?>
<!-- ai-investing brand mark. Square, works at 16px through 1024px.
     Motif: rising candle stack + spark = an autonomous trader watching the chart.
     Palette matches cockpit.css: bg #0b1220, primary #10b981 (emerald), accent #f59e0b. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ai-investing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- rounded-square background -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- subtle inner stroke for depth -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" ry="13.5" fill="none" stroke="#1f2937" stroke-width="1"/>

  <!-- three rising candles -->
  <!-- candle 1 (left, short, green) -->
  <line x1="16" y1="42" x2="16" y2="52" stroke="url(#up)" stroke-width="2" stroke-linecap="round"/>
  <rect x="13" y="44" width="6" height="8" rx="1.5" fill="url(#up)"/>

  <!-- candle 2 (middle, taller) -->
  <line x1="32" y1="28" x2="32" y2="48" stroke="url(#up)" stroke-width="2" stroke-linecap="round"/>
  <rect x="29" y="32" width="6" height="14" rx="1.5" fill="url(#up)"/>

  <!-- candle 3 (right, tallest) -->
  <line x1="48" y1="14" x2="48" y2="42" stroke="url(#up)" stroke-width="2" stroke-linecap="round"/>
  <rect x="45" y="18" width="6" height="22" rx="1.5" fill="url(#up)"/>

  <!-- spark (AI signal) on top of tallest candle -->
  <circle cx="48" cy="12" r="3.5" fill="#f59e0b"/>
  <circle cx="48" cy="12" r="6" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.45"/>
</svg>

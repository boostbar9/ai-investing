<?xml version="1.0" encoding="UTF-8"?>
<!-- Horizontal wordmark for the topbar: mark + 'ai-investing' set in a clean sans. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-label="ai-investing">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="up2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- compact mark -->
  <g transform="translate(4,4)">
    <rect width="48" height="48" rx="11" ry="11" fill="url(#bg2)"/>
    <rect x="0.5" y="0.5" width="47" height="47" rx="10.5" ry="10.5" fill="none" stroke="#1f2937"/>
    <line x1="12" y1="32" x2="12" y2="40" stroke="url(#up2)" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="9.75" y="33.5" width="4.5" height="6" rx="1.1" fill="url(#up2)"/>
    <line x1="24" y1="21" x2="24" y2="37" stroke="url(#up2)" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="21.75" y="24" width="4.5" height="10.5" rx="1.1" fill="url(#up2)"/>
    <line x1="36" y1="10" x2="36" y2="32" stroke="url(#up2)" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="33.75" y="13.5" width="4.5" height="16.5" rx="1.1" fill="url(#up2)"/>
    <circle cx="36" cy="9" r="2.6" fill="#f59e0b"/>
  </g>
  <!-- wordmark -->
  <text x="64" y="36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif" font-size="22" font-weight="600" letter-spacing="-0.5" fill="#f9fafb">ai-investing</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- The Seer — horizontal wordmark for the topbar.
     Mark + "The Seer" + tagline in a clean sans. Palette matches
     cockpit.css: midnight #0B0F14, primary teal #00E5C4, secondary
     violet #8B5CF6, text #F8FAFC. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" role="img" aria-label="The Seer">
  <defs>
    <linearGradient id="seer-bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131A24"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="seer-iris2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5C4"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="seer-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.7" stop-color="#00E5C4"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- compact mark -->
  <g transform="translate(4,8)">
    <rect width="48" height="48" rx="11" ry="11" fill="url(#seer-bg2)"/>
    <rect x="0.5" y="0.5" width="47" height="47" rx="10.5" ry="10.5" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <polygon points="24,6 40,15 40,33 24,42 8,33 8,15"
             fill="none" stroke="url(#seer-iris2)" stroke-width="1"
             stroke-linejoin="round" opacity="0.55"/>
    <path d="M6.5 24 C13 14, 35 14, 41.5 24 C35 34, 13 34, 6.5 24 Z"
          fill="none" stroke="url(#seer-iris2)" stroke-width="1.4"/>
    <circle cx="24" cy="24" r="6.4" fill="none" stroke="url(#seer-iris2)" stroke-width="1.2"/>
    <rect x="22.8" y="19.7" width="2.4" height="8.6" rx="0.8" fill="#00E5C4"/>
    <circle cx="24" cy="16" r="1.4" fill="#F8FAFC"/>
  </g>

  <!-- wordmark -->
  <text x="64" y="36" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.5"
        fill="url(#seer-text)">The Seer</text>

  <!-- tagline -->
  <text x="64" y="52" font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="8.5" font-weight="500" letter-spacing="2.4"
        fill="#94A3B8">AGENT-DRIVEN&#160;INVESTING</text>
</svg>

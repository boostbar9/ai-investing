<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Errors - ai-investing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; }
    .pill { padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .pill-red { background: #7f1d1d; color: #fca5a5; }
    .pill-yellow { background: #78350f; color: #fcd34d; }
    .pill-blue { background: #1e3a8a; color: #93c5fd; }
    .pill-gray { background: #1f2937; color: #9ca3af; }
    .pill-green { background: #064e3b; color: #6ee7b7; }
    .btn { padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 13px; cursor: pointer; transition: all .15s; border: 0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-ghost { background: #1f2937; color: #d1d5db; }
    .btn-ghost:hover:not(:disabled) { background: #374151; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    .nav-link { padding: 6px 12px; border-radius: 6px; color: #9ca3af; text-decoration: none; font-size: 13px; }
    .nav-link:hover { background: #1f2937; color: #f9fafb; }
    .nav-active { background: #1f2937; color: #f9fafb; }
    .nav-badge { display: inline-block; margin-left: 4px; padding: 1px 7px; font-size: 10px; font-weight: 700; border-radius: 999px; background: #7f1d1d; color: #fecaca; vertical-align: 1px; }
    .select { background: #0b1220; border: 1px solid #1f2937; border-radius: 6px; padding: 8px 10px; color: #f9fafb; font-size: 13px; }
    .err-row { border: 1px solid #1f2937; border-radius: 10px; padding: 12px 14px; background: #0b1220; }
    .err-row.sev-error { border-left: 4px solid #ef4444; }
    .err-row.sev-warning { border-left: 4px solid #f59e0b; }
    .err-row.sev-info { border-left: 4px solid #3b82f6; }
    .err-detail { background: #050810; border: 1px solid #1f2937; border-radius: 6px; padding: 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: #9ca3af; white-space: pre-wrap; overflow-x: auto; max-height: 280px; overflow-y: auto; }
    .ctx-chip { display: inline-block; background: #1f2937; color: #9ca3af; font-size: 10px; padding: 2px 8px; border-radius: 999px; margin: 2px 4px 2px 0; font-family: ui-monospace, Menlo, Consolas, monospace; }
    details > summary { cursor: pointer; user-select: none; }
    details > summary::-webkit-details-marker { color: #6b7280; }
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: 8px; background: #064e3b; color: #6ee7b7; font-size: 13px; box-shadow: 0 10px 25px rgba(0,0,0,.4); opacity: 0; transform: translateY(10px); transition: all .2s; z-index: 50; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <nav class="flex items-center gap-1 mb-4 text-sm">
      <a href="/" class="nav-link">Dashboard</a>
      <a href="/trading" class="nav-link">Trading</a>
      <a href="/models" class="nav-link">Models</a>
      <a href="/settings" class="nav-link">Settings</a>
      <a href="/updates" class="nav-link">Updates</a>
      <a href="/errors" class="nav-link nav-active">Errors<span id="nav-badge" class="nav-badge" style="display:none">0</span></a>
    </nav>

    <header class="mb-6 flex items-start justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl font-semibold">Error console</h1>
        <p class="text-sm text-gray-400">All cockpit exceptions, subprocess crashes, and warnings land here. Use Copy as Markdown to paste a debug report into chat.</p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button id="refresh-btn" class="btn btn-ghost">Refresh</button>
        <button id="copy-md-btn" class="btn btn-primary">Copy as Markdown</button>
        <button id="clear-btn" class="btn btn-danger">Clear log</button>
      </div>
    </header>

    <section class="card p-4 mb-4">
      <div class="flex items-center gap-4 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="text-xs text-gray-400">Filter:</span>
          <select id="sev-filter" class="select">
            <option value="">All severities</option>
            <option value="error">Errors only</option>
            <option value="warning">Warnings only</option>
            <option value="info">Info only</option>
          </select>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <span id="count-error" class="pill pill-red">0 errors</span>
          <span id="count-warning" class="pill pill-yellow">0 warnings</span>
          <span id="count-info" class="pill pill-blue">0 info</span>
          <span id="count-total" class="text-gray-500">0 total</span>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <label class="text-xs text-gray-400 flex items-center gap-2">
            <input id="auto-refresh" type="checkbox" checked />
            <span>Auto-refresh (10s)</span>
          </label>
        </div>
      </div>
    </section>

    <section id="entries" class="space-y-2">
      <div class="card p-6 text-center text-gray-500">Loading...</div>
    </section>
  </div>

  <div id="toast" class="toast">Copied</div>

  <script>
    let refreshTimer = null;
    let currentSeverity = '';

    function fmtTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString();
      } catch (e) {
        return iso;
      }
    }

    function pillForSev(sev) {
      if (sev === 'error') return 'pill pill-red';
      if (sev === 'warning') return 'pill pill-yellow';
      if (sev === 'info') return 'pill pill-blue';
      return 'pill pill-gray';
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function renderEntry(e, idx) {
      const sev = e.severity || 'error';
      const ctxChips = e.context ? Object.entries(e.context).map(([k,v]) =>
        `<span class="ctx-chip">${escapeHtml(k)}=${escapeHtml(typeof v === 'object' ? JSON.stringify(v) : v)}</span>`
      ).join('') : '';
      const detailBlock = e.detail ? `
        <details class="mt-2">
          <summary class="text-xs text-gray-400">Show traceback / detail</summary>
          <div class="err-detail mt-2">${escapeHtml(e.detail)}</div>
        </details>` : '';
      return `
        <div class="err-row sev-${sev}">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="${pillForSev(sev)}">${escapeHtml(sev)}</span>
              <span class="text-xs text-gray-500 font-mono">${escapeHtml(e.source || '?')}</span>
              <span class="text-xs text-gray-500">${escapeHtml(fmtTime(e.ts))}</span>
            </div>
          </div>
          <div class="mt-2 text-sm text-gray-100">${escapeHtml(e.message || '(no message)')}</div>
          ${ctxChips ? `<div class="mt-2">${ctxChips}</div>` : ''}
          ${detailBlock}
        </div>
      `;
    }

    function setCounts(counts) {
      const c = counts || {};
      const total = c.total || 0;
      document.getElementById('count-error').textContent = `${c.error || 0} errors`;
      document.getElementById('count-warning').textContent = `${c.warning || 0} warnings`;
      document.getElementById('count-info').textContent = `${c.info || 0} info`;
      document.getElementById('count-total').textContent = `${total} total`;
      const badge = document.getElementById('nav-badge');
      const open = (c.error || 0) + (c.warning || 0);
      if (open > 0) {
        badge.textContent = String(open);
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }
    }

    async function load() {
      try {
        const sev = currentSeverity;
        const url = sev ? `/api/errors?severity=${encodeURIComponent(sev)}` : '/api/errors';
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        setCounts(j.counts);
        const entries = j.entries || [];
        const container = document.getElementById('entries');
        if (entries.length === 0) {
          container.innerHTML = '<div class="card p-6 text-center text-gray-500">No entries to show. The error log is empty (or your filter has no matches).</div>';
          return;
        }
        container.innerHTML = entries.map(renderEntry).join('');
      } catch (e) {
        document.getElementById('entries').innerHTML =
          `<div class="card p-6 text-center text-red-400">Failed to load errors: ${escapeHtml(e.message)}</div>`;
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    async function copyMarkdown() {
      try {
        const r = await fetch('/api/errors/markdown?limit=100');
        const j = await r.json();
        const md = j.markdown || '';
        if (!md.trim()) { showToast('Nothing to copy'); return; }
        try {
          await navigator.clipboard.writeText(md);
          showToast('Copied ' + md.length + ' chars to clipboard');
        } catch (clipErr) {
          // Fallback: open a textarea so the user can copy manually
          const ta = document.createElement('textarea');
          ta.value = md;
          ta.style.position = 'fixed';
          ta.style.left = '0';
          ta.style.top = '0';
          ta.style.width = '100%';
          ta.style.height = '50vh';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); showToast('Copied (fallback)'); }
          catch (e) { showToast('Copy failed - select and Ctrl+C manually'); }
          setTimeout(() => ta.remove(), 4000);
        }
      } catch (e) {
        showToast('Failed: ' + e.message);
      }
    }

    async function clearLog() {
      if (!confirm('Clear ALL entries from the error log? This cannot be undone.')) return;
      const r = await fetch('/api/errors/clear', {method: 'POST'});
      if (!r.ok) { showToast('Clear failed'); return; }
      const j = await r.json();
      showToast(`Cleared ${j.cleared || 0} entries`);
      load();
    }

    document.getElementById('refresh-btn').addEventListener('click', load);
    document.getElementById('copy-md-btn').addEventListener('click', copyMarkdown);
    document.getElementById('clear-btn').addEventListener('click', clearLog);
    document.getElementById('sev-filter').addEventListener('change', (e) => {
      currentSeverity = e.target.value;
      load();
    });
    document.getElementById('auto-refresh').addEventListener('change', (e) => {
      if (e.target.checked) {
        refreshTimer = setInterval(load, 10000);
      } else if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
    });

    load();
    refreshTimer = setInterval(load, 10000);
  </script>
</body>
</html>

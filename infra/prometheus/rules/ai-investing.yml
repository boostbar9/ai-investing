groups:
  - name: ai-investing.risk
    interval: 30s
    rules:
      - alert: DrawdownAboveThreshold
        expr: portfolio_drawdown_ratio > 0.08
        for: 5m
        labels:
          severity: critical
          team: ai-investing
        annotations:
          summary: "Portfolio drawdown above 8% acceptance threshold"
          description: "Current drawdown is {{ $value | humanizePercentage }} (target < 8%)."

      - alert: RiskHaltFired
        expr: increase(risk_halt_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          team: ai-investing
        annotations:
          summary: "Risk halt fired"
          description: "{{ $value }} risk halt(s) fired in last 5m. Reason labels in dashboard."

      - alert: SharpeDropTrigger
        expr: portfolio_sharpe_drop_ratio > 0.10
        for: 1h
        labels:
          severity: warning
          team: ai-investing
        annotations:
          summary: "30d Sharpe dropped > 10% vs baseline"
          description: "Sharpe drop ratio is {{ $value | humanizePercentage }} (gate fires at 10%)."

  - name: ai-investing.execution
    interval: 30s
    rules:
      - alert: BrokerPrimaryDown
        expr: broker_up{role="primary"} == 0
        for: 2m
        labels:
          severity: critical
          team: ai-investing
        annotations:
          summary: "Primary broker unreachable"
          description: "Primary broker has been down for 2m. Router should be failing over to backup."

      - alert: BrokerFailoverSpike
        expr: increase(broker_failover_total[10m]) >= 3
        for: 0m
        labels:
          severity: warning
          team: ai-investing
        annotations:
          summary: "Broker failover spike"
          description: "{{ $value }} broker failover events in last 10m."

      - alert: OrderErrorRateHigh
        expr: |
          100 * sum by (broker) (rate(broker_order_total{status="error"}[5m]))
            / clamp_min(sum by (broker) (rate(broker_order_total[5m])), 0.001) > 5
        for: 5m
        labels:
          severity: warning
          team: ai-investing
        annotations:
          summary: "Broker order error rate > 5%"
          description: "{{ $labels.broker }} is erroring on > 5% of orders."

  - name: ai-investing.agents
    interval: 30s
    rules:
      - alert: AgentLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, agent) (rate(agent_request_duration_seconds_bucket[5m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          team: ai-investing
        annotations:
          summary: "Agent p95 latency > 10s"
          description: "{{ $labels.agent }} p95 latency is {{ $value }}s."

      - alert: AgentErrorRateHigh
        expr: |
          100 * sum by (agent) (rate(agent_request_total{status="error"}[5m]))
            / clamp_min(sum by (agent) (rate(agent_request_total[5m])), 0.001) > 10
        for: 5m
        labels:
          severity: warning
          team: ai-investing
        annotations:
          summary: "Agent error rate > 10%"
          description: "{{ $labels.agent }} is erroring on > 10% of calls."

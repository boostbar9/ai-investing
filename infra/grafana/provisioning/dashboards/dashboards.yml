apiVersion: 1

# Provider that loads JSON dashboards from /var/lib/grafana/dashboards/
# (mounted from infra/grafana/dashboards/). Edits in the UI are NOT
# preserved — change the JSON and redeploy instead.

providers:
  - name: ai-investing
    orgId: 1
    folder: "ai-investing"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true

apiVersion: 1

# Auto-provisioned datasources for the ai-investing Grafana instance.
# Mounted into the grafana container at
# /etc/grafana/provisioning/datasources/ by docker-compose.

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: Loki
        tags: ["service.name", "decision_id"]

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
